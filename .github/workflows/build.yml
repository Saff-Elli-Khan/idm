# Tests and builds IDM2 on Windows and macOS for every push to main (and on demand).
# The packaged apps are attached to each run as artifacts.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: idm2-windows-x64
          path: target/release/idm2.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test
      - run: bash tools/release-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: idm2-macos-universal
          path: dist/*-macos-universal.zip
